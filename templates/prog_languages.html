<center>

<button><a href="{% url 'yaziki:create_prog_lang' %}">Добавить</a></button>

<br><br>

<form action="/search/" method="GET">
    <input type="text" type="search" name="s" placrholder="Найти язык программ">
    <button type="submit">Найти</button>
</form>

{% for i in prog_lang %}
<img src="{{ i.image.url }}" alt="" width="300" height="400">
<h1>{{ i.title }}</h1>
<p> <a href="/prog_lang/{{ i.id }}/">Подробнее</a></p>

<p> <a href="/prog_lang/{{ i.id }}/delete/">Удалить</a> </p>
<p> <a href="/prog_lang/{{ i.id }}/update/">Редактировать</a> </p>
{% endfor %}


<div class="pagination">
    <span class="step-links">
        {% if page_obj.has_previous %}
            <a href="?page=1">&laquo; Первая</a>
            <a href="?page={{ page_obj.previous_page_number }}">Предыдущая</a>
        {% endif %}

        <span class="current">
            Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}.
        </span>

        {% if page_obj.has_next %}
            <a href="?page={{ page_obj.next_page_number }}">Следующая</a>
            <a href="?page={{ page_obj.paginator.num_pages }}">Последняя &raquo;</a>
        {% endif %}
    </span>
</div>


<form action="{% url 'login' %}" method="post">
    {%  csrf_token  %}
    <button type="submit">Выйти из аккаунта</button>
</form> 


</center>
